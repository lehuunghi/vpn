# VPN20 checks for Công ty TNHH TN20. Image publishing is in ghcr.yml.
name: ci

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run test:locale
          npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-dist
          path: internal/server/static/dist/
          if-no-files-found: error

  go:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-dist
          path: internal/server/static/dist/
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./internal/vpsrelay
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker-build:
    if: github.event_name == 'pull_request' || (github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch)
    needs: [web, go]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t "vpn20:ci-${GITHUB_SHA::8}" .
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify actual Docker replacement and rollback
        run: |
          docker build --build-arg VPN20_VERSION=1.1.0-integration -t vpn20:update-new .
          printf 'FROM vpn20:update-new\nRUN printf "#!/bin/sh\\nexit 1\\n" > /usr/local/bin/vpn20 && chmod 0755 /usr/local/bin/vpn20\n' | docker build -t vpn20:update-bad -
          sudo env "PATH=$PATH" "GOTOOLCHAIN=local" "VPN20_TEST_DOCKER_OLD_IMAGE=vpn20:ci-${GITHUB_SHA::8}" VPN20_TEST_DOCKER_NEW_IMAGE=vpn20:update-new VPN20_TEST_DOCKER_BAD_IMAGE=vpn20:update-bad go test -count=1 -v -timeout 8m ./internal/update -run '^TestDockerDaemonUpdate$'

  relay-ui:
    needs: [web, go]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: web-dist
          path: internal/server/static/dist/
      - name: Verify actual relay settings in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/relay-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/relay-browser/node_modules/playwright/cli.js" install --with-deps chromium --only-shell
          go build -o "$RUNNER_TEMP/vpn20-ui" ./cmd/vpn20
          go build -o "$RUNNER_TEMP/frps-ui" ./internal/vpsrelay/testdata/frps
          printf '127.0.0.1 relay.example.test\n' | sudo tee -a /etc/hosts >/dev/null
          NODE_PATH="$RUNNER_TEMP/relay-browser/node_modules" VPN20_UI_BINARY="$RUNNER_TEMP/vpn20-ui" VPN20_FRPS_BINARY="$RUNNER_TEMP/frps-ui" VPN20_UI_SCREENSHOT="$RUNNER_TEMP/relay-settings.png" node web/tests/relay-ui.cjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: relay-settings-browser
          path: ${{ runner.temp }}/relay-settings.png
          if-no-files-found: ignore
