name: DDNS Worker
on:
  push:
    paths: ['deploy/ddns-worker/**', '.github/workflows/ddns-worker.yml']
    tags: ['v*']
  pull_request:
    paths: ['deploy/ddns-worker/**', '.github/workflows/ddns-worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26
      - run: node --test deploy/ddns-worker/tests/api.test.js
      - name: Package Worker sources
        run: |
          cd deploy/ddns-worker
          zip -r ../../VPN20-DDNS-Worker-0.2.0.zip src tests schema.sql package.json wrangler.jsonc README.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vpn20-ddns-worker
          path: VPN20-DDNS-Worker-0.2.0.zip
  publish:
    needs: verify
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: vpn20-ddns-worker
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" VPN20-DDNS-Worker-0.2.0.zip --clobber
