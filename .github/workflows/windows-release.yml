name: Windows release

on:
  push:
    branches: [main, windows-native-release]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'web/**'
      - 'go.*'
      - 'packaging/windows/**'
      - 'docs/windows.md'
      - '.github/workflows/windows-release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - working-directory: web
        run: npm ci --ignore-scripts --no-audit --no-fund && npm run test:locale && npm run build
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build and verify real WireGuardNT, WinNAT and peer isolation
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - name: Install, restart, upgrade and uninstall the actual installer
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/release/*-setup.exe).FullName
          ./packaging/windows/smoke-install.ps1 -Installer $installer
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist/release -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist/release/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vpn20-windows-release
          path: dist/release/*
          if-no-files-found: error
      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-failure-diagnostics
          path: |
            C:/ProgramData/VPN20/vpn20.log*
            C:/Users/runneradmin/AppData/Local/Temp/Setup Log*.txt
          if-no-files-found: ignore

  publish:
    needs: [linux, windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vpn20-windows-release
          path: release
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '\r\n' < packaging/windows/VERSION)"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists. Bump packaging/windows/VERSION to publish another version."
            exit 0
          fi
          gh release create "$tag" release/* --target "$GITHUB_SHA" --prerelease --title "VPN20 $version — Windows x64" --notes-file packaging/windows/release-notes.md
