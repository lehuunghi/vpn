# Optional Cloudflare DDNS. Keep the API token in a local file, never in git.
# See docs/public-access.md. This creates DNS; it does not configure a router.
services:
  vpn20:
    environment:
      VPN20_CLOUDFLARE_DOMAIN: ${VPN20_CLOUDFLARE_DOMAIN:?Set the domain you own}
      VPN20_CLOUDFLARE_ZONE_ID: ${VPN20_CLOUDFLARE_ZONE_ID:?Set its Cloudflare Zone ID}
      VPN20_CLOUDFLARE_API_TOKEN_FILE: /run/secrets/cloudflare_api_token
    secrets:
      - cloudflare_api_token

secrets:
  cloudflare_api_token:
    file: ${VPN20_CLOUDFLARE_TOKEN_PATH:-./secrets/cloudflare-api-token.txt}
