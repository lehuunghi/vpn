# vpn20 on the host network: the fastest way to run it.
#
# With `network_mode: host` the WireGuard socket sits directly on the host's
# interfaces. There is no port mapping, no conntrack entry per client packet
# and no second NAT hop, which is worth a few percent of throughput and a
# little latency on a busy server. The trade-offs: wg0 is created in the
# host's namespace (you will see it in `ip link` and it is removed on
# shutdown), the NAT rules land in the host's nftables as a table named
# `vpn20`, and the admin UI listens on the host directly -- so it is bound to
# localhost below. Put a reverse proxy in front of it or set
# VPN20_TLS_SELF_SIGNED to reach it from elsewhere.
services:
  vpn20:
    image: ghcr.io/lehuunghi/vpn20:latest
    build: .
    container_name: vpn20
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      VPN20_ENDPOINT: vpn.example.com
      # For upgrades, point this at the database already present in /data.
      VPN20_DB: ${VPN20_DB:-/data/vpn20.db}
      VPN20_PORT: "51820"
      VPN20_SUBNET: 10.8.0.0/24
      VPN20_DNS: 1.1.1.1, 1.0.0.1
      VPN20_HTTP_LISTEN: "127.0.0.1:51821"
      # In host mode the forwarding sysctls are the host's own; vpn20 sets
      # them itself since it has NET_ADMIN, but if you prefer to own them
      # add `net.ipv4.ip_forward = 1` to /etc/sysctl.d/ and turn this off.
      # VPN20_MANAGE_SYSCTL: "false"
      # Pick the interface to masquerade on if auto-detection picks the
      # wrong one (it uses the default route).
      # VPN20_EGRESS_INTERFACE: eth0
    volumes:
      - vpn20-data:/data

volumes:
  vpn20-data:
    name: ${VPN20_DATA_VOLUME:-vpn20-data}
